# The release, the first of the phases DEC-324 point 3 lays out, and nothing
# here publishes.
#
# A tag starts a release and a person finishes it. This builds the five
# archives of the command line and the three of the window, writes the bill of
# materials of all of them and has SPDX's own validator read it, attests where
# the build came from, and opens an EMPTY draft. On a Windows runner it also
# makes the window's archive into the installer, installs it, installs a
# rebuild over it and removes it, so what the installer does is known before
# anything is signed. The archives for Windows and macOS, and the installer,
# are signed on the maintainer's machine afterwards, and the maintainer
# publishes. A release still needs the owner's word, and only the owner raises
# the version.
#
# Run by hand from the Actions tab, or on a push to main that changes the
# machinery of the release, it builds everything and attaches it to the run, so
# the build is tried without a tag being spent. The publish job is the only one
# that writes anything, and it is fenced behind the tag. Path filters are not
# evaluated for pushes of tags (GitHub's workflow syntax, read 2026-11-18), so a
# tag always runs this.
#
# Every action is named by the commit it runs, with its release beside it,
# because a tag can be moved to other code by whoever owns the action, and the
# publish job holds a token that can write to this repository. The other
# workflow that publishes, site.yml, does the same. A guard in internal/guard
# holds every workflow that can write to that.
#
# Adapted on 2026-11-18 from the release workflow of Cert Doctor, a project of
# the same owner under the same licence.
name: release

on:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/scripts/build_release.sh
      - .github/scripts/build_window.sh
      - .github/scripts/make_app_bundle.sh
      - .github/scripts/window_toolchain.sh
      - .github/scripts/fetch_software_renderer.sh
      - .github/scripts/build_msi.py
      - .github/scripts/check_msi.ps1
      - .github/msi/**
      - .github/requirements-spdx.txt
      - .github/mesa-dist-win
      - .github/opengl/**
      - .github/window-toolchain
      - cmd/sbom/**
      - internal/gui/appicon/lentils.icns
      - internal/gui/appicon/lentils.ico
      - go.mod
      - go.sum
  workflow_dispatch:

# Read only by default. The one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The toolchain ci.yml pins, for the reason it gives there.
  GOTOOLCHAIN: go1.27.4

jobs:
  check:
    name: the tag agrees with the code, and ci passed on it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      # Asked of the program rather than read out of the source, so this cannot
      # drift from what --version says.
      - name: what version the code says
        id: version
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go run ./cmd/qadg --version > "$RUNNER_TEMP/version.txt"
          said="$(head -n 1 "$RUNNER_TEMP/version.txt")"
          version="${said#qadg }"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          then
            echo "--version said \"${said}\", which does not carry a version this can read."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "the code says ${version}"

      # Nothing here runs the tests. ci.yml does, on three systems, with the
      # coverage floor, the linter and govulncheck, and a release is built from
      # a commit it passed. Asked BY NAME rather than as "were all the checks
      # green", because a query for every check answers about whatever happened
      # to report, so a workflow that never ran reads exactly like one that
      # passed.
      - name: ci was green on this exact commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verdict="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --commit="${GITHUB_SHA}" \
            --limit 1 --json status,conclusion \
            --jq 'if length == 0 then "never ran" else .[0] | "\(.status) \(.conclusion)" end')"
          echo "ci on ${GITHUB_SHA}: ${verdict}"
          if [ "$verdict" != "completed success" ]
          then
            echo "The ci workflow on this commit says: ${verdict}."
            echo "A release is built from a commit ci has passed, so push the commit,"
            echo "wait for ci, and tag it only then."
            exit 1
          fi

      # A release page points at the changelog, and a changelog with no section
      # for this version points at nothing. The other half matters more: lines
      # left under Unreleased are changes that went out without being described.
      - name: the changelog is closed for this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md
          then
            echo "CHANGELOG.md has no section for ${VERSION}."
            echo "Move what is under [Unreleased] into a dated section for this version first."
            exit 1
          fi
          left="$(sed -n '/^## \[Unreleased\]/,/^## \[[0-9]/p' CHANGELOG.md | sed '1d' | grep -v '^## \[' | grep -c '[^[:space:]]' || true)"
          if [ "$left" != "0" ]
          then
            echo "CHANGELOG.md still has ${left} line(s) under [Unreleased]."
            echo "Those are changes that would go out undescribed. Move them into ${VERSION}."
            exit 1
          fi
          echo "the changelog is closed for ${VERSION}"

      # The version is raised by the owner and nobody else. A tag that
      # disagrees with the code would put one number on the release page and
      # another in every report the release writes.
      - name: the tag says the same as the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]
          then
            echo "The tag is ${GITHUB_REF_NAME} and qadg --version says ${VERSION}."
            echo "Raise the version in the code first, commit it, then tag that commit."
            exit 1
          fi
          echo "the tag and the code agree on ${VERSION}"

  # The window, qadg-gui, on the three systems DEC-324 point 1 ships it for. It
  # reaches OpenGL and the windowing system through C, so it is built with cgo
  # on the system it is for rather than cross compiled with the command line,
  # the reason build_window.sh gives. Nothing is packed here: build_release.sh
  # packs every archive in one place, the window's with the command line's own
  # build.
  window:
    name: build the window on ${{ matrix.runner }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Every leg runs to its end, so one run says everything that is wrong.
      # A release needs all three, and the build job waits for all of them.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: the system libraries the window needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/window-libraries

      # Into RUNNER_TEMP and never into the checkout, for the reason the build
      # job gives. On Windows the script also fetches the software renderer and
      # checks it against its pin before anything is unpacked (DEC-323).
      - name: build the window
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/window"
          bash .github/scripts/build_window.sh "${{ matrix.goos }}/${{ matrix.goarch }}" "$RUNNER_TEMP/window"

      # Named after the target, which is the directory build_release.sh looks
      # for it in. An artefact keeps no file modes, and that script sets them.
      - name: keep the window
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qadg-gui_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ runner.temp }}/window
          if-no-files-found: error

  build:
    name: build the command line and pack every archive
    needs: [check, window]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      # Each into a directory of its own name, qadg-gui_<os>_<arch>, which is
      # what build_release.sh reads. download-artifact does that when the
      # pattern matches more than one artefact. A run that got here has all
      # three, since this job needs every leg of the window job, and a
      # directory missing all the same is refused by the script rather than
      # packed around.
      - name: fetch the windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qadg-gui_*
          path: ${{ runner.temp }}/windows

      # One runner cross compiles the five builds of the command line, because
      # it has no C in it. The window's builds come from the job above, and the
      # third argument is what makes this a release: without it the script
      # packs the command line alone and says so.
      #
      # Into RUNNER_TEMP and never into the checkout: every binary records
      # whether its tree had uncommitted changes, an untracked archive counts,
      # and the bill of materials refuses such a build.
      - name: build, write the bill of materials, pack
        shell: bash
        run: bash .github/scripts/build_release.sh "${{ needs.check.outputs.version }}" "$RUNNER_TEMP/release" "$RUNNER_TEMP/windows"

      # The bill of materials read by somebody else's understanding of SPDX as
      # well as ours. The tests of cmd/sbom hold the document to what we read
      # SPDX 2.3 to say, so a misreading passes all of them, and a document a
      # scanner cannot parse is a release whose components nobody can look up.
      # spdx-tools is the SPDX project's own validator.
      #
      # Into a virtual environment in RUNNER_TEMP, from a list pinned to the
      # bytes of every file, because what this job leaves is what the release
      # attests. The version is named rather than read from the document, so a
      # document in another version is refused. pyspdxtools prints nothing when
      # the document is valid.
      - name: the bill of materials is valid SPDX
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary :all: -r .github/requirements-spdx.txt
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" --version SPDX-2.3 -i "$RUNNER_TEMP/release/dist/verify-qadg_${VERSION}.spdx.json"
          echo "spdx-tools reads the bill of materials as valid SPDX-2.3"

      - name: keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/release/dist/*
          if-no-files-found: error

  # What the Windows installer DOES, asked on a clean Windows machine before
  # anything is signed (DEC-324, DEC-331): the window's archive of this very
  # build, made into an installer by the script the signing step uses,
  # installed, built again and installed over itself while qadg runs, and
  # removed. check_msi.ps1 asks each of those of Windows, and the same script
  # runs by hand on a test machine. Nothing here is published. The installer
  # people download is built on the machine with the card, from the signed
  # archive. A release candidate gets no installer, so there is nothing to
  # install for one. The draft waits for this job.
  installer:
    name: the Windows installer installs, replaces itself and leaves nothing behind
    needs: [check, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build

      # Two builds of one version, because every build carries a new
      # ProductCode, and the second installed over the first is what a release
      # rebuilt under the same number does on somebody's machine. WiX at the
      # version build_msi.py builds with, which refuses any other.
      - name: build the installer twice
        id: built
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if ($env:VERSION.Contains('-')) {
            "$env:VERSION is a release candidate, which gets no installer"
            "built=no" >> $env:GITHUB_OUTPUT
            exit 0
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet tool install wix exited $LASTEXITCODE"
          }
          foreach ($leg in 'first', 'second') {
            $out = Join-Path $env:RUNNER_TEMP $leg
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            python .github/scripts/build_msi.py --tag "v$env:VERSION" --archives (Join-Path $env:RUNNER_TEMP 'build') --out-dir $out
            if ($LASTEXITCODE -ne 0) {
              throw "build_msi.py refused v$env:VERSION"
            }
          }
          "built=yes" >> $env:GITHUB_OUTPUT

      - name: install, install a rebuild over it while qadg runs, uninstall
        if: steps.built.outputs.built == 'yes'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $msi = "qadg-setup_$($env:VERSION)_windows_amd64.msi"
          $archive = "qadg-gui_$($env:VERSION)_windows_amd64.zip"
          & ./.github/scripts/check_msi.ps1 -Version $env:VERSION `
            -First (Join-Path $env:RUNNER_TEMP "first/$msi") `
            -Second (Join-Path $env:RUNNER_TEMP "second/$msi") `
            -Archive (Join-Path $env:RUNNER_TEMP "build/$archive") `
            -Logs (Join-Path $env:RUNNER_TEMP 'msi-logs')

      - name: keep what msiexec said, when a check failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}/msi-logs/*.log
          if-no-files-found: ignore

  publish:
    name: attest the build and open an empty draft
    needs: [check, build, installer]
    # The only job that writes anything, and the only one fenced behind a tag.
    # A run by hand or on a push stops before here on purpose.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # id-token mints the short lived token that signs the statement, and
      # attestations writes it to this repository's store. Nothing else here
      # needs either. The artifact-metadata permission the action's readme
      # also lists is for a storage record, which it makes only for an image
      # pushed to a registry, and nothing here is one.
      id-token: write
      attestations: write
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/incoming

      # These are the bytes the RUNNER made. The Windows and macOS archives are
      # signed afterwards, which changes them, so the list a person checks a
      # download with is written on the machine that signs, over what will be
      # downloaded. This one names exactly what the statement below covers.
      - name: one list of what this build produced
        shell: bash
        working-directory: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          sha256sum -- * > build.sha256
          cat build.sha256

      # WHO built it and FROM WHAT: this repository, this commit, this workflow,
      # a runner GitHub hosts, signed with a short lived identity. A stolen key
      # cannot forge it, and a fork cannot claim to be this repository. It
      # stays true for the Linux archives, which nothing signs. For the Windows
      # and macOS ones it describes what the runner made before a person signed
      # it, which is true and is not what anybody downloads, so those get a
      # statement of their own once they are signed.
      #
      # actions/attest and not actions/attest-build-provenance, whose own
      # readme says that from version 4 it only wraps this one and that new
      # workflows should use this one (read 2026-11-18). Without a predicate it
      # makes the same SLSA build provenance.
      - name: attest what this build produced
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/incoming/build.sha256

      # The statement travels with the build to the machine that signs, which
      # checks the archives against it before touching them.
      - name: keep the statement with the build
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/incoming/build.provenance.sigstore.json"

      # No files. These are not the bytes a person gets, and an unsigned
      # program on a release page, even for a quarter of an hour, is a program
      # somebody downloads. A tag whose name carries a hyphen, v0.2.0-rc.1, is
      # a prerelease.
      - name: open the draft, with nothing in it yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--draft --title "${GITHUB_REF_NAME}" --notes-file .github/release-notes.md)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]
          then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          echo "drafted ${GITHUB_REF_NAME}, empty on purpose"

      # The seam between where builds belong and where signatures belong. The
      # name is what the signing step asks for.
      - name: hand the build over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-build-${{ github.ref_name }}
          path: ${{ runner.temp }}/incoming/*
          if-no-files-found: error

      - name: what happens next
        shell: bash
        run: |
          echo "Built, attested, and opened as an EMPTY DRAFT. Nothing is published."
          echo "The archives for Windows and macOS are signed on the maintainer's machine,"
          echo "and only then does anything go into the draft."
