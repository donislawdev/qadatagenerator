# The build runs on three systems because one of the promises this tool makes
# can only be checked that way: the same seed has to give the same bytes
# everywhere. A test that compares two runs cannot see a difference between
# machines, since it passes on each of them separately. The golden values are
# what notices, and they only notice if they run somewhere other than the
# machine that wrote them.
#
# What this cannot check, said out loud rather than left to be discovered: the
# document guards live outside the repository, so nothing here reads them. The
# consistency of the documents with the code stays a local step. The race
# detector is not here either. It moved to a file of its own on 2026-09-05 and
# the reason is written there.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reading the repository is all any job needs.
permissions:
  contents: read

# A newer push replaces an older run of the same branch. Nobody reads the
# result of a build that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than treated as a minimum. Determinism is an unbreakable
  # rule here, so the toolchain that produced a result is part of what has to
  # be reproducible.
  GOTOOLCHAIN: go1.27.4
  # This was off until 2026-09-05 and the whole file failed because of it.
  # Until 2026-08-12 the entire product built without a C toolchain, so off was
  # the right default. Since that day there is a second binary, cmd/qadg-gui,
  # and the window library excludes every one of its own files when cgo is off,
  # so every job walking ./... stopped compiling. Measured on the runner: build
  # constraints exclude all Go files in go-gl, and cmd/qadg-gui fails to set up
  # before a single test runs.
  #
  # The promise that no C toolchain is needed did not disappear. It narrowed to
  # the command line binary, which is what the two jobs below switch cgo off
  # for themselves to keep. The same split was made locally on 2026-08-12 in
  # the gate that runs before every commit, and this file is three weeks late
  # to it because nothing here was starting at the time.
  CGO_ENABLED: "1"

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every system reports. A difference between systems is the thing this
      # matrix exists to find, so cancelling the others at the first failure
      # would hide exactly the information it was set up to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Quoted on purpose. This project refuses an unquoted version in a
          # recipe because YAML reads 1.0 as a number, and the same reader is
          # reading this file.
          go-version: "1.27.4"

      # Linux only. The condition is on the step rather than in the action,
      # because a step that runs on three systems and does nothing on two of
      # them reads as though it might.
      - uses: ./.github/actions/window-libraries
        if: runner.os == 'Linux'

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: formatting
        shell: bash
        # The shell below is written without semicolons on purpose. Both forms
        # are equally ordinary in a shell, and the repository allows none.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]
          then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: test
        # Counted rather than cached. A cached pass says the code was fine
        # last time, which is not the question being asked here.
        run: go test -count=1 ./...

  dependencies:
    name: nothing in the binary can reach the network
    runs-on: ubuntu-latest
    env:
      # Off here, against the default above, because the question is about the
      # binary that ships. That one is built without a C toolchain, so the
      # graph walked below has to be the graph it really has.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      # There is a guard in internal/guard that asks this question of our own
      # files, and it cannot answer it for the whole binary. It reads the
      # imports written in this repository, so a dependency opening a socket
      # inside itself is invisible to it.
      #
      # This is the other half. go list walks the build graph of the shipped
      # command, everything the modules bring with them included, which is the
      # scope the promise is actually about: no server, no account, no
      # telemetry, no update check.
      #
      # syscall is deliberately not on this list although the guard refuses it
      # in our own files. Measured 2026-08-03: it is in the graph already,
      # pulled in by os, so listing it here would fail every run from the first
      # one and the job would be switched off within a week. The two lists
      # differ because they answer two different questions, and a guard nobody
      # can keep green is worth less than no guard at all.
      #
      # golang.org/x/sys is on it, all but its cpu package, for the reason the
      # guard refuses it in our own files: it calls each system the way syscall
      # does. Unlike syscall it is not in this graph. Measured 2026-11-17 with
      # this job's settings for linux, darwin, windows and freebsd.
      - name: no network package anywhere in the build graph
        shell: bash
        run: |
          found=$(go list -deps ./cmd/qadg | grep -E '(^|/)net($|/)|^os/exec$|^plugin$|^golang\.org/x/sys(/|$)' | grep -vx 'golang.org/x/sys/cpu' || true)
          if [ -n "$found" ]
          then
            echo "the shipped binary reaches packages that can leave this machine:"
            echo "$found"
            echo "this breaks the promise of no outgoing connections, which is a decision for the owner and not a change to make quietly"
            exit 1
          fi
          echo "the build graph of the command line binary contains no network package"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      # The linter type checks every package, so it needs what the compiler
      # needs. Measured on 2026-09-03: without this it reported the window as
      # could not import go-gl and said nothing about our own code.
      - uses: ./.github/actions/window-libraries

      # The nearest thing this project has to a reviewer who reads every line.
      # The owner does not read the code and there is no second author, so a
      # mechanical reader earns its keep here more than it would elsewhere.
      # Pinned rather than floating, for the same reason the toolchain is.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - uses: ./.github/actions/window-libraries

      # Reports only the vulnerabilities our code can actually reach, rather
      # than every advisory that mentions a module we happen to require. That
      # is what keeps it quiet enough to stay switched on, and a check nobody
      # switches off is the only kind worth having.
      #
      # It earns its place here more than in most projects. The tool is aimed
      # at environments that ask what is inside a binary before they will run
      # it, and the licence flag already answers half of that question.
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: "1.27.4"
          check-latest: false

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      # The floor lives here and in no other file. A threshold repeated in a
      # document goes stale the first time the real one moves, and then the
      # document is wrong about the one thing it was written to record.
      #
      # It is a ratchet. It may rise and it may not fall. Lowering it to turn a
      # red run green is the same act as editing a golden value for the same
      # reason, so it is the owner's decision rather than a way to get
      # unblocked.
      COVERAGE_FLOOR: "90"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - uses: ./.github/actions/window-libraries

      - name: measure and compare against the floor
        shell: bash
        # -coverpkg is the whole reason this job is trustworthy, and it is set
        # here rather than diagnosed later. Go credits coverage only to the
        # package being tested, so a project whose guards and validators live
        # in packages of their own gets a number that describes something other
        # than what it appears to.
        #
        # Measured here on 2026-08-02: 79.4% without the flag and 90.6% with
        # it. In a neighbouring project of the same owner the same mistake read
        # 0.0% against a real 43.7%, and the gate stood at zero looking as
        # though it worked. Both shapes are green on a build page and neither
        # number is the one anybody meant.
        run: |
          go test -count=1 -coverpkg=./internal/...,./cmd/... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "covered ${total}%, floor ${COVERAGE_FLOOR}%"
          below=$(awk -v have="$total" -v want="$COVERAGE_FLOOR" 'BEGIN { print (have < want) ? "yes" : "no" }')
          if [ "$below" = "yes" ]
          then
            echo "coverage is below the floor"
            echo "the floor is a ratchet and lowering it is the owner's decision, not a fix"
            exit 1
          fi

      - name: report what is least covered
        shell: bash
        # Printed on every run, passing or not. A gate that only speaks when it
        # is angry teaches people to read it only then.
        #
        # head is deliberately not in the pipe. This shell runs with pipefail,
        # so head closing the pipe after ten lines makes sort fail on a broken
        # pipe and the step ends with an error while printing the right answer.
        # It is a race against how fast sort finishes writing, which is why it
        # only appeared once the file had enough functions in it, and it was
        # invisible for a month because the step before this one always failed
        # first. Measured on 2026-09-05: sort: write failed, broken pipe.
        run: |
          echo "the ten least covered functions:"
          go tool cover -func=coverage.out | sort -k3 -n > "${RUNNER_TEMP}/least-covered.txt"
          head -10 "${RUNNER_TEMP}/least-covered.txt"

  cross:
    name: cross build from one machine
    runs-on: ubuntu-latest
    env:
      # Off here, against the default above, and this job is where the promise
      # is actually measured. Everything else in this file has cgo on because
      # the window is in the module, so without this line the sentence below
      # would be a sentence and not a check.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: build the command line binary for three systems
        shell: bash
        # This is the promise that the command line half needs no C toolchain
        # and no native machine. The window is a separate application and is
        # built natively, which is why it is not here.
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64
          do
            echo "building for $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/qadg
          done
