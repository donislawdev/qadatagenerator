# VINs for testing, with one broken value asked for in about a fifth of the
# rows.
#
# Every VIN has a correct check digit in the ninth place and a model year in the
# tenth. A VIN can match a real vehicle, so keep the file in test systems. The
# damage changes a digit or swaps two, and the manifest says your application
# should reject each one. It also lists the damage this build could not carry
# out, with the reason.
#
#   qadg generate vin.yaml
#
# writes vehicle.csv, expectation-manifest.json and run-note.json. The same seed
# breaks the same values on every machine.
version: "0.1"
seed: "vin"
locale: en-US
entities:
  vehicle:
    count: 100
    fields:
      vin: { generator: vin }
policy:
  layers: [L3]
  rows: 20%
  per_row: exactly_one
output:
  format: csv
