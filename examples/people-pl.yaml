# A hundred people in Poland, in one table.
#
# Each row has a name, a gender, a birth date, a PESEL and a city. First and
# last names follow the gender, and every PESEL carries the birth date and the
# gender of its row, with a correct check digit. A correct PESEL can belong to a
# real person, so keep the file in test systems.
#
#   qadg generate people-pl.yaml
#
# writes person.csv and run-note.json. The same seed gives the same rows on
# every machine.
version: "0.1"
seed: "people-pl"
locale: pl-PL
entities:
  person:
    count: 100
    primary_key: [pesel]
    fields:
      first_name: { generator: first_name }
      last_name:  { generator: last_name }
      gender:     { generator: gender }
      birth_date: { generator: birth_date }
      pesel:      { generator: pesel, unique: true }
      city:       { generator: city }
    consistency:
      - first_name matches: [gender]
      - pesel matches: [birth_date, gender]
output:
  format: csv
