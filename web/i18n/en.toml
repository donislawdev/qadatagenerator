# Words that change with a number. Count picks the form, and the other values
# are put in where the words name them.
[example_tables]
one = "1 table"
other = "{{ .Count }} tables"

[example_rows]
one = "1 row"
other = "{{ .Shown }} rows"

[example_first_rows]
one = "Its only row."
other = "The first {{ .Shown }} of its {{ .Total }} rows."

[example_all_rows]
one = "Its only row."
other = "All {{ .Total }} of its rows."

[example_first_lines]
one = "Its only line."
other = "The first {{ .Shown }} of its {{ .Total }} lines."

[example_all_lines]
one = "Its only line."
other = "All {{ .Total }} of its lines."

[example_damage_all]
one = "The recipe ordered 1 defect, and this build applied it."
other = "The recipe ordered {{ .Count }} defects, and this build applied all of them."

[example_damage_none]
one = "The recipe ordered 1 defect, and this build could not apply it. The manifest says why."
other = "The recipe ordered {{ .Count }} defects, and this build could not apply any of them. The manifest says why for each one."

# Some applied and some not, so always two defects or more.
[example_damage_some]
other = "The recipe ordered {{ .Count }} defects, and this build applied the {{ .Applied }} below. The other {{ .Refused }} are in the manifest as not applied, each with its reason, and the run above counts them by reason."

# Count is how many values the recipe of an identifier's page makes, and Rows
# the share of rows its policy asks to damage, as the recipe writes it.
[identifier_broken_lead]
one = "The recipe below makes 1 value and asks for damage in {{ .Rows }} of the rows. Download it and run it as it is, then change the count or the share to fit your tests."
other = "The recipe below makes {{ .Shown }} values and asks for damage in {{ .Rows }} of the rows. Download it and run it as it is, then change the count or the share to fit your tests."

# The count shortcode: how many of something this version of the program has,
# taken from the facts its tests write. List names the locales.
[count_damage]
one = "1 kind of damage"
other = "{{ .Count }} kinds of damage"

[count_generators]
one = "1 generator"
other = "{{ .Count }} generators"

[count_locales]
one = "1 locale: {{ .List }}"
other = "{{ .Count }} locales: {{ .List }}"
