# The English catalogue of everything the window says.
#
# A new language is a new file beside this one and no change in Go, which is
# the whole reason the window asks for text by key. The keys are declared as
# constants in Go so that a typo is a compile error rather than a label that
# renders as its own key, and a test closes this file against those constants
# in both directions.
#
# The rules for this text are the ones in the project handbook: say what the
# thing does, name what is on screen, no filler, and no em dash or semicolon.

