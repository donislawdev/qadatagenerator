# tekst-ok: the kinds this build carries come from the catalogue at run time, take.Check fills Allowed and the screen shows them
take.refusal.no-layers: No kind of damage is chosen
take.refusal.no-layers.why: The kinds decide what this does, and there is no default, because damaging the bytes of a file and damaging a value inside it are different requests.
take.refusal.no-layers.do: Tick at least one kind of damage above.

# tekst-ok: the kinds this build carries come from the catalogue at run time, take.Check fills Allowed and the screen shows them
take.refusal.unknown-layer: This build describes no damage of this kind
take.refusal.unknown-layer.why: A kind with nothing described in it would order a run that produced nothing while looking as though it had.
take.refusal.unknown-layer.do: Choose a kind from the list above.

take.refusal.delimiter: The field separator has to be one character
take.refusal.delimiter.why: It is the character that separates the fields of one line, both when this reads the file and when it writes it back.
take.refusal.delimiter.allowed: One character, such as a comma or a semicolon
take.refusal.delimiter.do: Put a single character in the field separator above.

# tekst-ok: the forms this build writes come from the exporter at run time, take.Check fills Allowed and the screen shows them
take.refusal.manifest-form: This build does not write a manifest in that form
take.refusal.manifest-form.why: The manifest is always written as JSON, and this setting asks for an extra form of it beside that one.
take.refusal.manifest-form.do: Choose a form from the list above.

take.refusal.share: The share of records cannot be read
take.refusal.share.why: It decides how much of the file is damaged, and a value nobody can read would leave that to a default the run never mentioned.
take.refusal.share.allowed: A percentage, such as 5% or 100%
take.refusal.share.do: Put a percentage in the share of records above.

# tekst-ok: the settings this build knows come from the engine at run time, take.Check fills Allowed and the screen shows them
take.refusal.per-row: No such setting for how many defects one record carries
take.refusal.per-row.why: Anything else would be read as one defect per record, so a misspelling would quietly reduce the damage and the run would still report success.
take.refusal.per-row.do: Choose a setting from the list above.

take.refusal.overwrite-source: This run would write over the file it is reading
take.refusal.overwrite-source.why: The damaged records would replace the records they were made from, and nothing could bring the file back.
take.refusal.overwrite-source.allowed: A directory that is not where the file itself sits
take.refusal.overwrite-source.do: Choose another directory to write to.

# tekst-ok: not about a value at all, this is the refusal for a reason the build has no words for
take.refusal.unnamed: This build stopped the run for a reason it cannot put into words
take.refusal.unnamed.why: The run was stopped for a real reason and this copy of the tool has no message for it, which is a fault in the tool rather than in what was asked of it.
take.refusal.unnamed.do: Report this, and say which settings were on screen.

