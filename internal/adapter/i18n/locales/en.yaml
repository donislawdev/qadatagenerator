take.result.oversized.why: This run wrote a manifest larger than this build reads back, so the Check results screen and verify will both refuse it. A manifest carries an entry for every record damaged and a description of every column, so damage fewer records or work on a narrower file.
take.result.unpartnered: Never ordered at all
take.result.unpartnered.why: Damage to the integrity of a set needs a second record to span, and there were too few rows for it.
