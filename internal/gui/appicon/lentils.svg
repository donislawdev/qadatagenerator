      <stop offset="0" stop-color="#FBAE7E"/>
      <stop offset="0.6" stop-color="#F2915B"/>
      <stop offset="1" stop-color="#E67D46"/>
    </radialGradient>
    <radialGradient id="face1" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FAB98C"/>
      <stop offset="0.6" stop-color="#F49E68"/>
