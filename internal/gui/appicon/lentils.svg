<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The application icon: a wooden spoon heaped with red lentils, and a few
    spilled beside it.

    This is the master. The window wears this file, drawn by the toolkit at
    256 px, and every size of lentils.ico from 40 px up is this file drawn at
    256 px and reduced. 32 px and below come from lentils-small.svg instead.

    Every lentil is a flat disc seen at a tilt: an edge band under a face,
    growing as the disc tips. That is what tells a lentil from a ball, which
    looks round from every side. They are matte and in three tones, because a
    gloss and one even colour read as sugar coated sweets.

    The spoon lies along x inside a group turned by -40 degrees. The front lip
    of the bowl is drawn last, over the lowest lentils, so the heap sits in
    the spoon rather than on it.

    Drawn from shapes. No artwork by anybody else is in this file.
  -->
